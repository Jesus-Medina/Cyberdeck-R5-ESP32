name: Deploy Lilith Cyberdeck
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/lilith-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lilith-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Probar renderizado 3D y navegación móvil
        run: node --test tests/explorer-smoke.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
